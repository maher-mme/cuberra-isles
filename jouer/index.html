		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<meta name="description" content="Cuberra Isles : une petite île, un cube, et tout un monde à explorer.">
	<script>
// Toujours à l'horizontale : si le téléphone (ou la tablette) est tenu debout,
// le jeu s'affiche couché (tourné d'un quart de tour) et remplit l'écran : on
// tourne l'appareil pour jouer, sans aucun message. Les touchers sont
// « retournés » pour que le jeu les reçoive au bon endroit.
// Sur Android, au premier toucher, on passe aussi en plein écran bloqué à
// l'horizontale (Apple ne le permet pas aux sites, d'où le quart de tour).
(function () {
	var tourne = false;
	function miseEnPage() {
		var canvas = document.getElementById("canvas");
		if (!canvas) return;
		var largeur = window.innerWidth;
		var hauteur = window.innerHeight;
		tourne = hauteur > largeur && matchMedia("(pointer: coarse)").matches;
		var style = canvas.style;
		style.position = "fixed";
		style.top = "0px";
		style.left = (tourne ? largeur : 0) + "px";
		if (tourne && (document.fullscreenElement || document.webkitFullscreenElement)) {
			// Plein écran mais l'écran n'a pas pu être bloqué à l'horizontale :
			// on en sort, et le quart de tour prend le relais.
			var sortir = document.exitFullscreen || document.webkitExitFullscreen;
			if (sortir) sortir.call(document);
		}
		var l = tourne ? hauteur : largeur;
		var h = tourne ? largeur : hauteur;
		var ratio = window.devicePixelRatio || 1;
		style.width = l + "px";
		style.height = h + "px";
		style.transformOrigin = "0 0";
		style.transform = tourne ? "rotate(90deg)" : "none";
		var w = Math.round(l * ratio);
		var hh = Math.round(h * ratio);
		if (canvas.width !== w) canvas.width = w;
		if (canvas.height !== hh) canvas.height = hh;
	}
	function retourner(liste) {
		if (!liste) return;
		var largeur = window.innerWidth;
		var hauteur = window.innerHeight;
		for (var i = 0; i < liste.length; i++) {
			var t = liste[i];
			if (t.cuberraRetourne) continue;
			var x = t.clientY * largeur / hauteur;
			var y = (largeur - t.clientX) * hauteur / largeur;
			try {
				Object.defineProperty(t, "clientX", {value: x});
				Object.defineProperty(t, "clientY", {value: y});
				Object.defineProperty(t, "pageX", {value: x});
				Object.defineProperty(t, "pageY", {value: y});
				Object.defineProperty(t, "cuberraRetourne", {value: true});
			} catch (e) {}
		}
	}
	["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (nom) {
		window.addEventListener(nom, function (e) {
			if (!tourne) return;
			retourner(e.touches);
			retourner(e.changedTouches);
			retourner(e.targetTouches);
		}, true);
	});
	var fait = false;
	window.addEventListener("touchend", function () {
		if (fait || !matchMedia("(pointer: coarse)").matches) return;
		fait = true;
		var page = document.documentElement;
		var demande = page.requestFullscreen || page.webkitRequestFullscreen;
		if (!demande) return;
		Promise.resolve(demande.call(page)).then(function () {
			if (screen.orientation && screen.orientation.lock) {
				return screen.orientation.lock("landscape");
			}
		}).catch(function () {});
	}, true);
	window.addEventListener("resize", miseEnPage);
	window.addEventListener("orientationchange", function () { setTimeout(miseEnPage, 150); });
	document.addEventListener("DOMContentLoaded", function () {
		miseEnPage();
		setInterval(miseEnPage, 1000);
	});
})();
</script>
<script>
// Le son sur téléphone : les navigateurs bloquent le son tant qu'on n'a pas
// touché l'écran. On garde les « contextes audio » créés par le jeu, et on les
// réveille au premier toucher (ou clic, ou touche du clavier).
(function () {
	var contextes = [];
	window.cuberraContextesAudio = contextes;
	["AudioContext", "webkitAudioContext"].forEach(function (nom) {
		var Original = window[nom];
		if (!Original) return;
		var Enveloppe = function (options) {
			var contexte = new Original(options);
			contextes.push(contexte);
			return contexte;
		};
		Enveloppe.prototype = Original.prototype;
		window[nom] = Enveloppe;
	});
	function reveiller() {
		contextes.forEach(function (contexte) {
			if (contexte.state !== "running") {
				contexte.resume().then(function () {
					console.log("Son : contexte réveillé (" + contexte.state + ")");
				}, function (e) {
					console.log("Son : impossible de réveiller (" + e + ")");
				});
			}
		});
	}
	["touchstart", "touchend", "pointerdown", "mousedown", "keydown"].forEach(function (evenement) {
		window.addEventListener(evenement, reveiller, true);
	});
})();
</script>
<script>
// Diagnostic : si le jeu reste bloqué après le chargement (ou en cas d'erreur),
// on affiche en bas de l'écran ce qui se passe, pour pouvoir le signaler.
// Le tout est aussi gardé dans le navigateur : avec ?diag, on revoit ce qui
// s'est passé la fois d'avant (si le jeu s'était figé).
(function () {
	var lignes = [];
	var debut = Date.now();
	var stockage = null;
	var avant = [];
	try {
		stockage = window.localStorage;
		avant = JSON.parse(stockage.getItem("cuberraDiagnostic") || "[]");
	} catch (e) {}
	// `etiquette` : une ligne d'état (« Son : », « Mémoire : »…) qui remplace
	// la précédente du même genre, au lieu de s'ajouter.
	function ajouter(texte, etiquette) {
		if (etiquette) {
			lignes = lignes.filter(function (ligne) { return ligne.indexOf(" " + etiquette) < 0; });
			texte = etiquette + texte;
		}
		var temps = ((Date.now() - debut) / 1000).toFixed(1) + "s ";
		lignes.push(temps + String(texte).slice(0, 220));
		if (lignes.length > 16) lignes.shift();
		try { if (stockage) stockage.setItem("cuberraDiagnostic", JSON.stringify(lignes)); } catch (e) {}
		var boite = document.getElementById("diagnostic");
		if (boite) boite.textContent = (avant.length ? "— La fois d'avant —\n" + avant.join("\n") + "\n— Maintenant —\n" : "") + lignes.join("\n");
	}
	["log", "warn", "error"].forEach(function (sorte) {
		var original = console[sorte];
		console[sorte] = function () {
			try { ajouter(sorte + " : " + Array.prototype.join.call(arguments, " ")); } catch (e) {}
			return original.apply(console, arguments);
		};
	});
	window.addEventListener("error", function (e) { ajouter("ERREUR : " + e.message); });
	window.addEventListener("unhandledrejection", function (e) {
		ajouter("ERREUR : " + ((e.reason && e.reason.message) || e.reason));
	});
	// Les gels de plus d'une seconde (le jeu ne répond plus pendant ce temps)
	try {
		new PerformanceObserver(function (liste) {
			liste.getEntries().forEach(function (tache) {
				if (tache.duration > 1000) ajouter("Gel de " + Math.round(tache.duration) + " ms");
			});
		}).observe({entryTypes: ["longtask"]});
	} catch (e) {}
	// La mémoire utilisée, et depuis combien de temps on joue
	setInterval(function () {
		var jeu = typeof engine !== "undefined" && engine.rtenv && engine.rtenv.HEAP8;
		if (!jeu) return;
		var page = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + " Mo" : "?";
		ajouter("jeu " + Math.round(jeu.length / 1048576) + " Mo, page " + page + " (partie de " +
			Math.round((Date.now() - debut) / 60000) + " min)", "Mémoire : ");
	}, 10000);
	document.addEventListener("DOMContentLoaded", function () {
		var gl = document.createElement("canvas").getContext("webgl2");
		ajouter("Appareil : " + navigator.userAgent);
		ajouter("Mémoire de l'appareil : " + (navigator.deviceMemory || "?") + " Go · processeurs : " + (navigator.hardwareConcurrency || "?") +
			" · WebGL2 : " + (gl ? "oui" : "NON") + " · écran : " + screen.width + "x" + screen.height);
		var canvas = document.getElementById("canvas");
		if (canvas) {
			canvas.addEventListener("webglcontextlost", function () { ajouter("ERREUR : l'affichage (WebGL) a été perdu"); });
		}
		var boite = document.createElement("pre");
		boite.id = "diagnostic";
		boite.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:50%;overflow:auto;margin:0;padding:8px;" +
			"font:11px/1.35 monospace;background:rgba(0,0,0,.85);color:#7dff9a;z-index:999;display:none;white-space:pre-wrap";
		document.body.appendChild(boite);
		ajouter("Page chargée");
		var force = /diag/.test(location.search);
		if (force) {
			setInterval(function () {
				var etats = (window.cuberraContextesAudio || []).map(function (c) {
					return c.state + " " + c.sampleRate + "Hz";
				});
				ajouter(etats.length ? etats.join(", ") : "aucun contexte audio", "Son : ");
			}, 3000);
		}
		setInterval(function () {
			var statut = document.getElementById("status");
			var bloque = statut && getComputedStyle(statut).visibility !== "hidden" && getComputedStyle(statut).display !== "none" &&
				Date.now() - debut > 30000;
			var erreur = /ERREUR|error :/.test(lignes.join("\n"));
			boite.style.display = force || bloque || erreur ? "block" : "none";
		}, 1000);
	});
})();
</script>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":43521632,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
