	<script>
// Toujours à l'horizontale : si le téléphone (ou la tablette) est tenu debout,
// le jeu s'affiche couché (tourné d'un quart de tour) et remplit l'écran : on
// tourne l'appareil pour jouer, sans aucun message. Les touchers sont
// « retournés » pour que le jeu les reçoive au bon endroit.
// Sur Android, au premier toucher, on passe aussi en plein écran bloqué à
// l'horizontale (Apple ne le permet pas aux sites, d'où le quart de tour).
(function () {
	var tourne = false;
	function miseEnPage() {
		var canvas = document.getElementById("canvas");
		if (!canvas) return;
		var largeur = window.innerWidth;
		var hauteur = window.innerHeight;
		tourne = hauteur > largeur && matchMedia("(pointer: coarse)").matches;
		var style = canvas.style;
		style.position = "fixed";
		style.top = "0px";
		style.left = (tourne ? largeur : 0) + "px";
		if (tourne && (document.fullscreenElement || document.webkitFullscreenElement)) {
			// Plein écran mais l'écran n'a pas pu être bloqué à l'horizontale :
			// on en sort, et le quart de tour prend le relais.
			var sortir = document.exitFullscreen || document.webkitExitFullscreen;
			if (sortir) sortir.call(document);
		}
		var l = tourne ? hauteur : largeur;
		var h = tourne ? largeur : hauteur;
		var ratio = window.devicePixelRatio || 1;
		style.width = l + "px";
		style.height = h + "px";
		style.transformOrigin = "0 0";
		style.transform = tourne ? "rotate(90deg)" : "none";
		var w = Math.round(l * ratio);
		var hh = Math.round(h * ratio);
		if (canvas.width !== w) canvas.width = w;
		if (canvas.height !== hh) canvas.height = hh;
	}
	function retourner(liste) {
		if (!liste) return;
		var largeur = window.innerWidth;
		var hauteur = window.innerHeight;
		for (var i = 0; i < liste.length; i++) {
			var t = liste[i];
			if (t.cuberraRetourne) continue;
			var x = t.clientY * largeur / hauteur;
			var y = (largeur - t.clientX) * hauteur / largeur;
			try {
				Object.defineProperty(t, "clientX", {value: x});
				Object.defineProperty(t, "clientY", {value: y});
				Object.defineProperty(t, "pageX", {value: x});
				Object.defineProperty(t, "pageY", {value: y});
				Object.defineProperty(t, "cuberraRetourne", {value: true});
			} catch (e) {}
		}
	}
	["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (nom) {
		window.addEventListener(nom, function (e) {
			if (!tourne) return;
			retourner(e.touches);
			retourner(e.changedTouches);
			retourner(e.targetTouches);
		}, true);
	});
	var fait = false;
	window.addEventListener("touchend", function (e) {
		if (fait || !matchMedia("(pointer: coarse)").matches) return;
		if (e.target && e.target.closest && e.target.closest("#cuberra-installer")) return;
		// (Déjà installé comme une appli : il est déjà en plein écran.)
		if (matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches) return;
		fait = true;
		var page = document.documentElement;
		var demande = page.requestFullscreen || page.webkitRequestFullscreen;
		if (!demande) return;
		Promise.resolve(demande.call(page)).then(function () {
			if (screen.orientation && screen.orientation.lock) {
				return screen.orientation.lock("landscape");
			}
		}).catch(function () {});
	}, true);
	window.addEventListener("resize", miseEnPage);
	window.addEventListener("orientationchange", function () { setTimeout(miseEnPage, 150); });
	document.addEventListener("DOMContentLoaded", function () {
		miseEnPage();
		setInterval(miseEnPage, 1000);
	});
})();
</script>
<script>
// Le son sur téléphone : les navigateurs bloquent le son tant qu'on n'a pas
// touché l'écran. On garde les « contextes audio » créés par le jeu, et on les
// réveille au premier toucher (ou clic, ou touche du clavier).
(function () {
	var contextes = [];
	window.cuberraContextesAudio = contextes;
	["AudioContext", "webkitAudioContext"].forEach(function (nom) {
		var Original = window[nom];
		if (!Original) return;
		var Enveloppe = function (options) {
			var contexte = new Original(options);
			contextes.push(contexte);
			return contexte;
		};
		Enveloppe.prototype = Original.prototype;
		window[nom] = Enveloppe;
	});
	function reveiller() {
		contextes.forEach(function (contexte) {
			if (contexte.state !== "running") {
				contexte.resume().then(function () {
					console.log("Son : contexte réveillé (" + contexte.state + ")");
				}, function (e) {
					console.log("Son : impossible de réveiller (" + e + ")");
				});
			}
		});
	}
	["touchstart", "touchend", "pointerdown", "mousedown", "keydown"].forEach(function (evenement) {
		window.addEventListener(evenement, reveiller, true);
	});
})();
</script>
<script>
// La musique, dans le navigateur : elle est jouée par le lecteur audio du
// navigateur (un élément <audio>, branché sur un « contexte audio » pour régler
// le volume, même sur iPhone), et pas par le moteur du jeu. Le navigateur la
// décode à part, petit à petit : elle ne saute jamais quand le jeu ralentit un
// instant, et ne prend presque pas de mémoire. Le jeu donne chaque morceau une
// fois (voir GameSettings) ; fondu de 2 secondes entre deux morceaux.
// Quand la page est cachée (autre appli, autre onglet, écran éteint), tout le
// son se met en pause, et reprend au retour.
(function () {
	var FONDU = 2.0;
	var GARDEES = 4;
	var Contexte = window.AudioContext || window.webkitAudioContext;
	if (!Contexte) return;
	var ctx = null;
	var general = null;
	var volume = 0.5;
	var pistes = {};
	var ordre = [];
	var lecteurs = [];
	var actuel = null;
	function contexte() {
		if (!ctx) {
			// (Créé avec l'enveloppe du son, plus haut : réveillé au premier toucher.)
			ctx = new Contexte();
			general = ctx.createGain();
			general.gain.value = volume;
			general.connect(ctx.destination);
		}
		return ctx;
	}
	function fondu(lecteur, cible) {
		var c = contexte();
		var g = lecteur.gain.gain;
		g.cancelScheduledValues(c.currentTime);
		g.setValueAtTime(g.value, c.currentTime);
		g.linearRampToValueAtTime(cible, c.currentTime + FONDU);
		if (cible > 0) return;
		setTimeout(function () {
			if (lecteur === actuel) return;
			lecteur.el.pause();
			lecteur.el.removeAttribute("src");
			lecteur.el.load();
			lecteur.source.disconnect();
			lecteur.gain.disconnect();
			lecteurs = lecteurs.filter(function (l) { return l !== lecteur; });
		}, FONDU * 1000 + 200);
	}
	function lancer(lecteur) {
		if (document.hidden) return;
		var essai = lecteur.el.play();
		if (essai && essai.catch) essai.catch(function () {});
	}
	window.cuberraMusique = {
		// Le jeu a-t-il déjà donné ce morceau ?
		a: function (nom) { return !!pistes[nom]; },
		// Le jeu donne un morceau (le fichier MP3, en base64).
		ajouter: function (nom, base64) {
			if (pistes[nom]) return;
			var texte = atob(base64);
			var octets = new Uint8Array(texte.length);
			for (var i = 0; i < texte.length; i++) octets[i] = texte.charCodeAt(i);
			pistes[nom] = URL.createObjectURL(new Blob([octets], {type: "audio/mpeg"}));
			ordre.push(nom);
			// (On ne garde que les derniers morceaux : la mémoire reste petite.)
			while (ordre.length > GARDEES) {
				var vieux = ordre.shift();
				if (lecteurs.some(function (l) { return l.nom === vieux; })) {
					ordre.push(vieux);
					break;
				}
				URL.revokeObjectURL(pistes[vieux]);
				delete pistes[vieux];
			}
		},
		jouer: function (nom) {
			if (!pistes[nom]) return false;
			if (actuel && actuel.nom === nom) return true;
			var c = contexte();
			var ancien = actuel;
			// Un morceau qui s'effaçait encore : il remonte, sans recommencer.
			actuel = null;
			for (var i = 0; i < lecteurs.length; i++) {
				if (lecteurs[i].nom === nom) actuel = lecteurs[i];
			}
			if (!actuel) {
				var el = new Audio();
				el.loop = true;
				el.preload = "auto";
				el.src = pistes[nom];
				var source = c.createMediaElementSource(el);
				var gain = c.createGain();
				gain.gain.value = 0;
				source.connect(gain);
				gain.connect(general);
				actuel = {el: el, source: source, gain: gain, nom: nom};
				lecteurs.push(actuel);
			}
			if (ancien) fondu(ancien, 0);
			lancer(actuel);
			fondu(actuel, 1);
			return true;
		},
		volume: function (v) {
			volume = v;
			if (general) general.gain.setTargetAtTime(v, ctx.currentTime, 0.05);
		},
		info: function () {
			if (!actuel) return "aucune";
			return actuel.nom + ", " + (actuel.el.paused ? "EN PAUSE" : "joue") + ", " + Math.round(actuel.el.currentTime) +
				" s, contexte " + (ctx ? ctx.state : "?");
		}
	};
	// Avant le premier toucher, le navigateur refuse de jouer : on relance au premier geste.
	function reveiller() {
		if (document.hidden) return;
		if (ctx && ctx.state !== "running") ctx.resume();
		if (actuel && actuel.el.paused) lancer(actuel);
	}
	["touchend", "pointerdown", "mousedown", "keydown"].forEach(function (evenement) {
		window.addEventListener(evenement, reveiller, true);
	});
	// Page cachée : tout le son en pause (la musique et les bruitages du jeu).
	document.addEventListener("visibilitychange", function () {
		var contextes = window.cuberraContextesAudio || [];
		if (document.hidden) {
			contextes.forEach(function (c) { if (c.suspend) c.suspend(); });
			lecteurs.forEach(function (l) { l.el.pause(); });
		} else {
			contextes.forEach(function (c) { if (c.resume) c.resume(); });
			if (actuel) lancer(actuel);
		}
	});
})();
</script>
<script>
// Diagnostic : si le jeu reste bloqué après le chargement (ou en cas d'erreur),
// on affiche en bas de l'écran ce qui se passe, pour pouvoir le signaler.
// Le tout est aussi gardé dans le navigateur : avec ?diag, on revoit ce qui
// s'est passé la fois d'avant (si le jeu s'était figé).
(function () {
	var lignes = [];
	var debut = Date.now();
	var stockage = null;
	var avant = [];
	try {
		stockage = window.localStorage;
		avant = JSON.parse(stockage.getItem("cuberraDiagnostic") || "[]");
	} catch (e) {}
	// `etiquette` : une ligne d'état (« Son : », « Mémoire : »…) qui remplace
	// la précédente du même genre, au lieu de s'ajouter.
	function ajouter(texte, etiquette) {
		if (etiquette) {
			lignes = lignes.filter(function (ligne) { return ligne.indexOf(" " + etiquette) < 0; });
			texte = etiquette + texte;
		}
		var temps = ((Date.now() - debut) / 1000).toFixed(1) + "s ";
		lignes.push(temps + String(texte).slice(0, 220));
		if (lignes.length > 16) lignes.shift();
		try { if (stockage) stockage.setItem("cuberraDiagnostic", JSON.stringify(lignes)); } catch (e) {}
		var boite = document.getElementById("diagnostic");
		if (boite) boite.textContent = (avant.length ? "— La fois d'avant —\n" + avant.join("\n") + "\n— Maintenant —\n" : "") + lignes.join("\n");
	}
	["log", "warn", "error"].forEach(function (sorte) {
		var original = console[sorte];
		console[sorte] = function () {
			try { ajouter(sorte + " : " + Array.prototype.join.call(arguments, " ")); } catch (e) {}
			return original.apply(console, arguments);
		};
	});
	window.addEventListener("error", function (e) { ajouter("ERREUR : " + e.message); });
	window.addEventListener("unhandledrejection", function (e) {
		ajouter("ERREUR : " + ((e.reason && e.reason.message) || e.reason));
	});
	// Les gels de plus d'une seconde (le jeu ne répond plus pendant ce temps)
	try {
		new PerformanceObserver(function (liste) {
			liste.getEntries().forEach(function (tache) {
				if (tache.duration > 1000) ajouter("Gel de " + Math.round(tache.duration) + " ms");
			});
		}).observe({entryTypes: ["longtask"]});
	} catch (e) {}
	// La mémoire utilisée, et depuis combien de temps on joue
	setInterval(function () {
		var jeu = typeof engine !== "undefined" && engine.rtenv && engine.rtenv.HEAP8;
		if (!jeu) return;
		var page = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + " Mo" : "?";
		ajouter("jeu " + Math.round(jeu.length / 1048576) + " Mo, page " + page + " (partie de " +
			Math.round((Date.now() - debut) / 60000) + " min)", "Mémoire : ");
	}, 10000);
	document.addEventListener("DOMContentLoaded", function () {
		var gl = document.createElement("canvas").getContext("webgl2");
		ajouter("Appareil : " + navigator.userAgent);
		ajouter("Mémoire de l'appareil : " + (navigator.deviceMemory || "?") + " Go · processeurs : " + (navigator.hardwareConcurrency || "?") +
			" · WebGL2 : " + (gl ? "oui" : "NON") + " · écran : " + screen.width + "x" + screen.height);
		var canvas = document.getElementById("canvas");
		if (canvas) {
			canvas.addEventListener("webglcontextlost", function () { ajouter("ERREUR : l'affichage (WebGL) a été perdu"); });
		}
		var boite = document.createElement("pre");
		boite.id = "diagnostic";
		boite.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:50%;overflow:auto;margin:0;padding:8px;" +
			"font:11px/1.35 monospace;background:rgba(0,0,0,.85);color:#7dff9a;z-index:999;display:none;white-space:pre-wrap";
		document.body.appendChild(boite);
		ajouter("Page chargée");
		var force = /diag/.test(location.search);
		if (force) {
			setInterval(function () {
				var etats = (window.cuberraContextesAudio || []).map(function (c) {
					return c.state + " " + c.sampleRate + "Hz";
				});
				ajouter(etats.length ? etats.join(", ") : "aucun contexte audio", "Son : ");
			}, 3000);
		}
		setInterval(function () {
			var statut = document.getElementById("status");
			var bloque = statut && getComputedStyle(statut).visibility !== "hidden" && getComputedStyle(statut).display !== "none" &&
				Date.now() - debut > 30000;
			var erreur = /ERREUR|error :/.test(lignes.join("\n"));
			boite.style.display = force || bloque || erreur ? "block" : "none";
		}, 1000);
	});
})();
</script>
<script>
// Installer le jeu comme une appli (téléphone et tablette, dans le navigateur
// seulement) : une vraie icône, en plein écran, et rien à télécharger, donc
// aucun « fichier inconnu ». Chrome et Edge (Android) proposent l'installation :
// on l'offre avec un bandeau. Sur iPhone et iPad, on explique comment faire.
(function () {
	function dejaInstalle() {
		return matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches
			|| navigator.standalone === true;
	}
	if (dejaInstalle() || !matchMedia("(pointer: coarse)").matches) return;
	var stockage = null;
	try { stockage = window.localStorage; } catch (e) {}
	function refuse() {
		try { return stockage !== null && stockage.getItem("cuberraInstallMasque") === "1"; } catch (e) { return false; }
	}
	var bandeau = null;
	function masquer(pourToujours) {
		if (bandeau) bandeau.remove();
		bandeau = null;
		if (pourToujours) {
			try { if (stockage) stockage.setItem("cuberraInstallMasque", "1"); } catch (e) {}
		}
	}
	// Le bandeau suit le jeu : s'il est affiché couché (téléphone debout), le
	// bandeau l'est aussi, en haut de l'image du jeu.
	function placer() {
		if (!bandeau) return;
		var largeur = window.innerWidth;
		var hauteur = window.innerHeight;
		// (Une largeur fixe : couché, il ne doit pas se tasser contre le bord.)
		bandeau.style.width = Math.round(Math.min(560, Math.max(largeur, hauteur) * 0.86)) + "px";
		var w = bandeau.offsetWidth;
		var h = bandeau.offsetHeight;
		if (hauteur > largeur) {
			bandeau.style.left = (largeur - 12 - h / 2 - w / 2) + "px";
			bandeau.style.top = (hauteur / 2 - h / 2) + "px";
			bandeau.style.transform = "rotate(90deg)";
		} else {
			bandeau.style.left = (largeur / 2 - w / 2) + "px";
			bandeau.style.top = "12px";
			bandeau.style.transform = "none";
		}
	}
	function montrer(texte, bouton, action) {
		masquer(false);
		bandeau = document.createElement("div");
		bandeau.id = "cuberra-installer";
		bandeau.style.cssText = "position:fixed;z-index:1001;box-sizing:border-box;display:flex;align-items:center;gap:10px;" +
			"padding:10px 12px;border-radius:14px;background:rgba(20,24,44,.94);color:#fff;font:15px/1.35 sans-serif;" +
			"box-shadow:0 4px 18px rgba(0,0,0,.4);border:2px solid #e0b84a";
		var mot = document.createElement("span");
		mot.textContent = texte;
		bandeau.appendChild(mot);
		if (bouton) {
			var b = document.createElement("button");
			b.textContent = bouton;
			b.style.cssText = "flex:none;padding:8px 14px;border:0;border-radius:10px;background:#e0b84a;color:#1a1f2b;font:bold 15px sans-serif";
			b.addEventListener("click", action);
			bandeau.appendChild(b);
		}
		var fermer = document.createElement("button");
		fermer.textContent = "✕";
		fermer.setAttribute("aria-label", "Fermer");
		fermer.style.cssText = "flex:none;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font:16px sans-serif";
		fermer.addEventListener("click", function () { masquer(true); });
		bandeau.appendChild(fermer);
		document.body.appendChild(bandeau);
		placer();
		// Il s'en va tout seul au bout d'un moment (il reviendra la prochaine fois).
		setTimeout(function () { masquer(false); }, 25000);
	}
	window.addEventListener("resize", placer);
	window.addEventListener("beforeinstallprompt", function (e) {
		e.preventDefault();
		if (refuse()) return;
		var invitation = e;
		montrer("📲 Installe le jeu comme une appli : une vraie icône, en plein écran, sans fichier à télécharger !", "Installer", function () {
			invitation.prompt();
			invitation.userChoice.then(function (choix) { masquer(choix.outcome === "accepted"); });
		});
	});
	window.addEventListener("appinstalled", function () { masquer(true); });
	var apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
	if (apple && !refuse()) {
		document.addEventListener("DOMContentLoaded", function () {
			montrer("📲 Pour installer le jeu comme une appli : touche Partager (le carré avec une flèche), puis « Sur l'écran d'accueil ».", "", null);
		});
	}
})();
</script>

	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
